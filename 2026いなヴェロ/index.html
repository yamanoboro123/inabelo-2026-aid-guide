<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2026 いなヴェロ エイドステーションの時間順ガイド">
  <title>2026 いなヴェロ｜エイド巡りガイド</title>
  <style>
    :root{--ink:#12202b;--muted:#667580;--paper:#f5f7f3;--card:#fff;--line:#dbe3df;--lime:#e5f500;--blue:#073b4c;--orange:#ff8c42;--radius:18px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Yu Gothic",YuGothic,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.65}
    .wrap{max-width:1180px;margin:auto;padding:0 22px}.hero{background:var(--blue);color:#fff;padding:28px 0 34px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:auto -80px -130px auto;width:360px;height:260px;border-radius:50%;background:var(--lime);opacity:.9;transform:rotate(-12deg)}
    .topline{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:.86rem;letter-spacing:.08em;color:#d8ebed}.brand{font-weight:800;color:var(--lime);letter-spacing:.12em}.hero h1{font-size:clamp(2rem,5vw,4.2rem);line-height:1.1;max-width:760px;margin:22px 0 12px;letter-spacing:-.04em}.hero p{max-width:700px;margin:0;color:#d8ebed;font-size:1.05rem}.hero .wrap{position:relative;z-index:1}
    .notice{margin:-18px auto 0;position:relative;z-index:2}.notice-inner{background:var(--lime);border-radius:14px;padding:14px 18px;color:#1e2d20;font-weight:700;box-shadow:0 12px 24px #073b4c20;display:flex;align-items:center;gap:10px}.notice-inner span{font-size:1.25rem}
    main{padding:34px 0 64px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:0 0 16px}.section-head h2{font-size:1.55rem;margin:0}.section-head p{margin:0;color:var(--muted);font-size:.9rem}.timeline{display:grid;gap:14px}.time-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;display:grid;grid-template-columns:100px 1fr;gap:20px;box-shadow:0 5px 18px #12202b0a}.time{font-size:1.7rem;font-weight:900;color:var(--blue);line-height:1}.time small{display:block;color:var(--muted);font-size:.76rem;margin-top:7px;font-weight:600}.stops{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}.stop{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fbfcfa;min-height:72px}.stop strong{display:block;font-size:.9rem;color:var(--blue)}.stop p{margin:2px 0 0;font-size:.86rem}.dash{color:#98a5a3}.station-list{margin-top:38px}.station-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.station{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.station label{display:flex;gap:10px;align-items:flex-start;font-weight:800;cursor:pointer}.station input{width:19px;height:19px;accent-color:var(--orange);margin-top:4px}.station small{display:block;color:var(--muted);margin:8px 0 0 29px;font-size:.8rem}.map-link{display:inline-block;margin:9px 0 0 29px;color:var(--blue);font-size:.82rem;font-weight:800;text-decoration-thickness:2px;text-underline-offset:3px}.map-pending{display:inline-block;margin:9px 0 0 29px;padding:2px 8px;border-radius:999px;background:#eef1ee;color:#728078;font-size:.76rem;font-weight:700}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.btn:focus-visible,.station input:focus-visible,.map-link:focus-visible{outline:3px solid var(--orange);outline-offset:2px}.source{margin-top:42px;padding-top:18px;border-top:1px solid var(--line);font-size:.86rem;color:var(--muted)}.source a{color:var(--blue);font-weight:700}.footer{background:#e9efeb;padding:20px 0;color:var(--muted);font-size:.8rem}
    @media (max-width:720px){.wrap{padding:0 15px}.hero{padding-top:20px}.topline{font-size:.76rem}.hero h1{font-size:2.25rem;margin-top:17px}.notice-inner{font-size:.88rem}.time-card{grid-template-columns:1fr;gap:10px}.time{font-size:1.35rem;display:flex;align-items:baseline;gap:8px}.time small{display:inline;margin:0}.stops{grid-template-columns:1fr 1fr}.station-grid{grid-template-columns:1fr}.section-head{display:block}.section-head p{margin-top:4px}}
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap">
    <div class="topline"><span class="brand">INABELO 2026</span><span>エイドステーション案内</span></div>
    <h1>食べて、走って、<br>次のエイドへ。</h1>
    <p>画像の配布スケジュールを、出発前に確認しやすい「時間順の周回ガイド」に整理しました。</p>
  </div></header>
  <div class="wrap notice"><div class="notice-inner"><span>!</span> これは時刻順の整理です。地図上の駅間距離・道路順は含まれていません。</div></div>
  <main><div class="wrap">
    <section aria-labelledby="timeline-title"><div class="section-head"><h2 id="timeline-title">時間順タイムライン</h2><p>各時間帯で立ち寄れるエイドと提供品</p></div>
      <div class="timeline" id="timeline"></div>
    </section>
    <section class="station-list" aria-labelledby="station-title"><div class="section-head"><h2 id="station-title">エイド到着チェック</h2><p>友人と共有して、到着した場所にチェック</p></div>
      <div class="station-grid" id="stations"></div>
      <div class="tools"><button class="btn primary" id="copyBtn" type="button">共有用リンクをコピー</button><button class="btn" id="gpxBtn" type="button" disabled title="GoogleマップURLと座標の登録後に利用できます">GPXをダウンロード（準備中）</button><button class="btn" id="resetBtn" type="button">チェックをリセット</button></div>
    </section>
    <p class="source">出典：添付画像「2026いなヴェロ」エイドステーション一覧。食数・表記は画像の読み取りに基づくため、当日の掲示を優先してください。</p>
  </div></main>
  <footer class="footer"><div class="wrap">INABELO 2026 · Ride kindly, eat happily.</div></footer>
  <script>
    const schedule = {
      '10:30': [['ポークプラザ松葉','特製ホットドッグ 30食']],
      '11:00': [['ポークプラザ松葉','スペアリブのトロトロ煮 50食'],['マル信緑香園','石榴パフェ 30個'],['FUJI HUB','麻婆たまご 30個'],['okudo 中村舎','中村舎特製 龍田揚げ 30個'],['にぎわいの森','FUCHITEI：野菜スープ＆ゼリースープ 30食'],['こんま亭','いなべの小キャベツ 30個'],['うりぼう','「うりぼ〜の」カップジェラート 50個']],
      '11:30': [['マル信緑香園','水まんじゅう（緑茶30・ほうじ30）']],
      '12:00': [['ポークプラザ松葉','さくらポーク焼売 100個'],['マル信緑香園','一口バームクーヘン 30個・ニコニコ氷 30個'],['FUJI HUB','キーマカレー 30人前'],['okudo 中村舎','さくらポーク肉巻きおむすび 30個'],['にぎわいの森','魔法のぱん：カスタード 30食'],['こんま亭','いなべの小キャベツ 10個'],['うりぼう','ランチボックス 50個']],
      '12:30': [['マル信緑香園','一口茶々バナナ 30本']],
      '13:00': [['ポークプラザ松葉','豚しゃぶ 30食'],['マル信緑香園','石榴ようかん（緑茶30・ほうじ30）'],['FUJI HUB','親鶏焼き 30食'],['okudo 中村舎','白玉ぜんざい 30人前'],['にぎわいの森','いなべ菓子入合：石榴菜とう焼き 30食'],['こんま亭','いなべのシュー菜郎（ほうじ茶）30個'],['うりぼう','「うりぼ〜の」カップジェラート 50個']],
      '14:00': [['うりぼう','冷やし焼き芋 50個']]
    };
    const allYouCanEat = {'ポークプラザ松葉':'さくらポークドッグ・チキン・メンチカツ、天然水','マル信緑香園':'石榴水（緑茶・ほうじ茶）、水出し番茶、いなべのほうじ茶','FUJI HUB':'たまごかけごはん、親鶏卵スープ','okudo 中村舎':'究極の塩むすび、炊き込みご飯、漬物、特製味噌汁','にぎわいの森':'キッチュエビい・いなべの惣菜・菓子、カフェロブなど','こんま亭':'いなべのプチシュー菜郎','うりぼう':'おばあちゃんの和菓子、うりぼうちぎり、冷やし栗、天然水'};
    // Googleマップの共有URLと座標が揃ったら、空文字と null を差し替えてください。
    // mapUrl は友人向けリンク、lat/lon はGPX生成に使用します。
    const stationData = [
      {name:'ポークプラザ松葉',mapUrl:'https://maps.app.goo.gl/A15a5Msobhp8jYcs5',lat:35.146503,lon:136.5249178},
      {name:'マル信緑香園',mapUrl:'https://maps.app.goo.gl/ctqvSamxxjEReFh68',lat:35.1062319,lon:136.4914326},
      {name:'FUJI HUB',mapUrl:'https://maps.app.goo.gl/pU8Ujw8sRziidwSL8',lat:35.0951191,lon:136.5204909},
      {name:'okudo 中村舎',mapUrl:'https://maps.app.goo.gl/ErmQqFhSHTnQKNm98',lat:35.1635629,lon:136.4921372},
      {name:'にぎわいの森',mapUrl:'https://maps.app.goo.gl/QHHpyHMgWA47sjgk8',lat:35.1577874,lon:136.5166771},
      {name:'こんま亭',mapUrl:'https://maps.app.goo.gl/z7y8V2vVNZ5Ahf976',lat:35.1085161,lon:136.5194737},
      {name:'うりぼう',mapUrl:'https://maps.app.goo.gl/SpAfXk2xC3UBnfq16',lat:35.0953273,lon:136.5702515},
      {name:'弘福舎',mapUrl:'https://maps.app.goo.gl/hr95N3Tv7TtoE5o69',lat:35.2078155,lon:136.5127209},
      {name:'ういこっちゃね',mapUrl:'https://maps.app.goo.gl/t8EXwhnq1UNZHnev9',lat:35.1930283,lon:136.4933979}
    ];
    const timeline = document.querySelector('#timeline');
    Object.entries(schedule).forEach(([time,items])=>{ const el=document.createElement('article'); el.className='time-card'; el.innerHTML=`<div class="time">${time}<small>${items.length} station${items.length>1?'s':''}</small></div><div class="stops">${items.map(([s,p])=>`<div class="stop"><strong>${s}</strong><p>${p}</p></div>`).join('')}</div>`; timeline.appendChild(el); });
    const stations = document.querySelector('#stations');
    stationData.forEach((station,i)=>{const key='inabelo-station-'+i; const el=document.createElement('div'); el.className='station'; const map=station.mapUrl?`<a class="map-link" href="${station.mapUrl}" target="_blank" rel="noopener noreferrer">Googleマップで開く</a>`:'<span class="map-pending">地図リンク準備中</span>'; el.innerHTML=`<label><input type="checkbox" data-key="${key}"><span>${station.name}</span></label><small>${allYouCanEat[station.name]||'一人一点：特製アイスコーヒー／団子（みたらし・磯辺）'}</small>${map}`; stations.appendChild(el)});
    document.querySelectorAll('input[type=checkbox]').forEach(input=>{input.checked=localStorage.getItem(input.dataset.key)==='1';input.addEventListener('change',()=>localStorage.setItem(input.dataset.key,input.checked?'1':'0'))});
    document.querySelector('#resetBtn').addEventListener('click',()=>{document.querySelectorAll('input[type=checkbox]').forEach(i=>{i.checked=false;localStorage.removeItem(i.dataset.key)})});
    document.querySelector('#gpxBtn').addEventListener('click',()=>{
      const missing = stationData.filter(s=>!Number.isFinite(s.lat)||!Number.isFinite(s.lon));
      if(missing.length){ alert('GPX生成には各エイドの緯度・経度が必要です。'); return; }
      const esc = s => s.replace(/[<>&'\"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','\"':'&quot;'}[c]));
      const points = stationData.map((s,i)=>`    <wpt lat="${s.lat}" lon="${s.lon}"><name>${i+1}. ${esc(s.name)}</name><sym>Food</sym></wpt>`).join(String.fromCharCode(10));
      const gpx = ['<?xml version="1.0" encoding="UTF-8"?>','<gpx version="1.1" creator="2026 Inabelo Aid Guide" xmlns="http://www.topografix.com/GPX/1/1">',points,'</gpx>'].join(String.fromCharCode(10));
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([gpx],{type:'application/gpx+xml'})); a.download='2026-inabelo-aid-stations.gpx'; a.click(); URL.revokeObjectURL(a.href);
    });
    if(stationData.every(s=>s.mapUrl&&Number.isFinite(s.lat)&&Number.isFinite(s.lon))){const button=document.querySelector('#gpxBtn');button.disabled=false;button.title='';button.textContent='GPXをダウンロード';}
    document.querySelector('#copyBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);document.querySelector('#copyBtn').textContent='リンクをコピーしました';setTimeout(()=>document.querySelector('#copyBtn').textContent='共有用リンクをコピー',1800)}catch(e){alert('ブラウザのアドレスバーからURLをコピーしてください')}});
  </script>
</body>
</html>
